[project]
name = "ai-tools"
version = "0.1.0"
description = "MCP server and AI-assisted engineering tools for R&D, IaC, and Git workflows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tyler Zervas", email = "tz-dev@vectorweight.com" }]
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
    "httpx>=0.27.0,<0.28.0",
    "python-gnupg>=0.5.0,<0.6.0",
    "PyYAML>=6.0,<7.0",
    "GitPython>=3.1.0,<3.2.0",
    "pydantic>=2.0,<3.0",
    "python-hcl2>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "httpx>=0.27.0,<0.28.0",
    "ruff>=0.8.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
]
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter; historical modules vary
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
